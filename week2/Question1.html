<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokhara University Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="input-section">
        <h2>Pokhara University Marks Calculator</h2>
        <p><i>Enter your first semester result:</i></p>
        <input type="number" id="s1" placeholder="Calculus I"><br><br>
        <input type="number" id="s2" placeholder="C Programming"><br><br>
        <input type="number" id="s3" placeholder="Basic Electrical Engineering"><br><br>
        <input type="number" id="s4" placeholder="Electronic Devices and Circuits"><br><br>
        <input type="number" id="s5" placeholder="Digital Logic"><br><br>
        <input type="number" id="s6" placeholder="Engineering Workshop"><br><br>
        <input type="number" id="s7" placeholder="Technical English"><br><br>
        <input type="number" id="s8" placeholder="Engineering Chemistry"><br><br>
        <button onclick="calculateResult()">Check Result</button>
        <p id="total"></p>
        <p id="result"></p>
    </div>
    
</body>
</html>
